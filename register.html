<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro · Quetzalcoatl Aerolínea</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
<header id="nav"></header>
<main>
  <div class="tarjeta estrecha">
    <h1>Crear cuenta</h1>
    <div id="msg" class="msg" hidden role="alert"></div>
    <form id="form-registro">
      <div class="campo"><label for="name">Nombre completo</label><input id="name" name="name" required maxlength="100" autocomplete="name"></div>
      <div class="campo"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="campo"><label for="password">Contraseña (mínimo 6 caracteres)</label><input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"></div>
      <div class="campo"><label for="password2">Confirmar contraseña</label><input id="password2" name="password2" type="password" required minlength="6" autocomplete="new-password"></div>
      <button type="submit">Crear cuenta</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>
</main>
<script src="scripts.js"></script>
</body>
</html>
