<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Quetzalcoatl Aerolínea</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
<header id="nav"></header>
<main>
  <div class="tarjeta estrecha">
    <h1>Iniciar sesión</h1>
    <div id="msg" class="msg" hidden role="alert"></div>
    <form id="form-login">
      <div class="campo"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button type="submit">Entrar</button>
    </form>
    <p>¿Aún no tienes cuenta? <a href="register.html">Regístrate</a></p>
  </div>
</main>
<script src="scripts.js"></script>
</body>
</html>
